[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atsn"
version = "0.1.0"
description = "Multi-stage ALT-text generation pipeline for e-commerce product images"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "openai>=1.40.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]
